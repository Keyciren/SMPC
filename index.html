<!--pk-begin--><title>Torneo Santa María Pickle Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
/* Layout: club-header band → level chips + programa chip → stage tabs → working panel. Night-court palette from the club crest. */
:root{
  --bg:#06080A; --surface:#0E1213; --surface-2:#141A1A; --line:rgba(201,161,90,.20); --line-soft:rgba(243,239,230,.08);
  --gold:#C9A15A; --gold-hi:#E6C885; --silver:#C4CAD0; --ink:#F3EFE6; --muted:#8C938F; --court:#1B3B2A; --court-hi:#285A3E;
  --warn:#E09A55; --bad:#D9705F; --good:#7FC29B;
  --f-display:"Bodoni Moda","Didot","Times New Roman",serif;
  --f-ui:"Jost","Futura","Century Gothic","Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

.club{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.club img{width:76px;height:76px;border-radius:50%;flex:none}
.club-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.t-name{font-family:var(--f-display);font-size:clamp(24px,4.5vw,36px);font-weight:500;line-height:1.1;background:none;border:0;padding:0;width:100%}
.t-meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.t-meta input{background:none;border:0;border-bottom:1px dashed var(--line);padding:2px 0;color:var(--muted);min-width:0;width:11em}
.save{font-size:12px;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--court-hi)}
.save.pub::before{background:var(--gold-hi)}
.save.busy::before{background:var(--gold)} .save.err::before{background:var(--bad)}

.levels{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lv{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center}
.lv small{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.lv[aria-pressed="true"]{background:var(--gold);color:#16120A;border-color:var(--gold)}
.lv[aria-pressed="true"] small{color:#3d3220}
.lv.add{border-style:dashed;color:var(--gold)}
.lv.prog{border-color:var(--court-hi);background:rgba(40,90,62,.25)}
.lv.prog[aria-pressed="true"]{background:var(--court-hi);color:var(--ink);border-color:var(--gold)}
.lv.prog[aria-pressed="true"] small{color:var(--gold-hi)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tab{background:none;border:0;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-right:1px solid var(--line)}
.tab:last-child{border-right:0}
.tab b{font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.tab span{font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--court)}
.tab[aria-selected="true"] b{color:var(--gold-hi)}

h2{font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0}
h3{font-family:var(--f-display);font-weight:500;font-size:24px;margin:0}
.hint{color:var(--muted);font-size:13px;max-width:70ch;margin:0}
.panel{display:flex;flex-direction:column;gap:22px}
.box{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inp,select.inp{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.inp:disabled{opacity:.75;border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--court-hi);color:var(--ink)}
.seg button:disabled{cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--gold);width:16px;height:16px}

.btn{background:var(--gold);color:#16120A;border:0;border-radius:999px;padding:9px 18px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--gold-hi)}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.danger{background:none;color:var(--bad);border:1px solid rgba(217,112,95,.4)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.fmt-sum{font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--gold-hi)}

.teams{display:flex;flex-direction:column;gap:8px}
.team{display:grid;grid-template-columns:2.2em 1fr 1fr 6.5em 2em;gap:8px;align-items:center}
.team.singles{grid-template-columns:2.2em 1fr 6.5em 2em}
.team .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:13px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px}
.x:hover{color:var(--bad)}
@media (max-width:560px){
  .team,.team.singles{grid-template-columns:1.8em 1fr 5.4em 1.6em;row-gap:6px}
  .team .p2{grid-column:2}
  .team .gsel{grid-row:1;grid-column:3}
  .team .x{grid-row:1;grid-column:4}
}
.gpills{display:flex;gap:8px;flex-wrap:wrap}
.gpill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.gpill b{color:var(--ink);font-weight:500}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;text-align:right;border-bottom:1px solid var(--line-soft)}
.std th:nth-child(2),.std td:nth-child(2){text-align:left}
.std td:first-child{color:var(--muted);width:2em}
.tg{margin-left:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:1px 7px;border:1px solid}
.tg.oro{color:var(--gold-hi);border-color:var(--gold)}
.tg.plata{color:var(--silver);border-color:rgba(196,202,208,.5)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.gh h3 span{color:var(--gold)}
.prog{font-size:12px;color:var(--muted);letter-spacing:.06em}

.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.rtitle{grid-column:1/-1;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.mc{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mc.done{border-color:var(--line)}
.mtop{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mtop .when{color:var(--ink);font-variant-numeric:tabular-nums}
.mtop .sp{flex:1}
.pill{font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line-soft);white-space:nowrap}
.pill.ok{color:var(--gold-hi);border-color:var(--line)}
.pill.live{color:var(--warn);border-color:rgba(224,154,85,.4)}
.side{display:flex;align-items:center;gap:6px}
.side .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.side .nm small{display:block;color:var(--muted);font-size:12px}
.side.win .nm{color:var(--gold-hi);font-weight:500}
.side.win .nm::before{content:"●";color:var(--gold);font-size:9px;margin-right:6px;vertical-align:2px}
.sc{width:2.8em;text-align:center;background:var(--bg);border:2px solid var(--gold);border-radius:8px;padding:7px 0;font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;box-shadow:0 0 0 3px rgba(201,161,90,.12)}
.sc:focus{border-color:var(--gold-hi);box-shadow:0 0 0 4px rgba(230,200,133,.28);outline:none}
.sc.bad{border-color:var(--bad)}
.sc:disabled{border-color:transparent;box-shadow:none;opacity:1}
.mwarn{font-size:12px;color:var(--warn)}
.seed{color:var(--muted);font-style:italic}

.copa{border-top:3px solid var(--gold)}
.copa.plata{border-top-color:var(--silver)}
.copa h3{color:var(--gold-hi)}
.copa.plata h3{color:var(--silver)}
.ko{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;align-items:start}
.ko .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.ko h4{margin:0;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.champ{display:flex;align-items:center;gap:16px;padding:16px;border-radius:12px;background:linear-gradient(135deg,var(--court),var(--surface));border:1px solid var(--gold);flex-wrap:wrap}
.champ .tr{font-family:var(--f-display);font-size:38px;color:var(--gold);line-height:1}
.plata .champ{border-color:var(--silver)} .plata .champ .tr{color:var(--silver)}
.champ .who{font-family:var(--f-display);font-size:clamp(20px,3.6vw,28px);font-weight:500;overflow-wrap:anywhere}
.champ .sub{color:var(--muted);font-size:13px}

.status{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px 18px;border-radius:14px;border:1px solid}
.status.ok{border-color:rgba(127,194,155,.45);background:rgba(40,90,62,.22)}
.status.warn{border-color:rgba(224,154,85,.5);background:rgba(224,154,85,.08)}
.status .big{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.status.ok .big{color:var(--good)} .status.warn .big{color:var(--warn)}
.status .txt{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.status .txt b{font-weight:500;font-size:16px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ptab{min-width:760px}
.ptab th,.ptab td{text-align:left;vertical-align:top}
.ptab td.hr{white-space:nowrap;width:6.5em}
.ptab td.hr b{display:block;font-size:16px;font-weight:500}
.ptab td.hr span{font-size:11px;color:var(--muted)}
.cell{border-left:3px solid var(--court-hi);padding:4px 8px;display:flex;flex-direction:column;gap:2px}
.cell.k-S,.cell.k-F,.cell.k-T{border-left-color:var(--gold)}
.cell.k-T.plata{border-left-color:var(--silver)}
.podio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px}
.podio div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.podio span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.podio b{font-weight:500;overflow-wrap:anywhere}
.podio .p1 b{color:var(--gold-hi)}
.cell.k-S.plata,.cell.k-F.plata{border-left-color:var(--silver)}
.cell .ph{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cell .ph b{color:var(--gold);font-weight:500}
.cell .vs{font-size:13px;overflow-wrap:anywhere}
.cell .res{font-size:12px;color:var(--gold-hi)}
.lv.res{border-color:var(--gold)}
.lv.hist{border-color:var(--line)}
.exbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.exmsg{font-size:13px;color:var(--gold-hi);min-height:1.2em}
.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.hcard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hcard h3{font-size:22px}
.hcard .meta{font-size:12px;color:var(--muted)}
.hcard ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink)}
.lvsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.okst{font-size:14px;color:var(--good)} .pendst{font-size:14px;color:var(--warn)}
.radio{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.radio input{accent-color:var(--gold);width:16px;height:16px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:28px;border:1px dashed var(--line);border-radius:14px}
.empty h3{font-size:28px}
.ro{font-size:12px;color:var(--muted);border:1px solid var(--line-soft);border-radius:999px;padding:3px 10px}
@media (max-width:560px){ .tab span{display:none} .club img{width:58px;height:58px} }
@media (prefers-reduced-motion:no-preference){ .tab,.lv,.btn{transition:background .15s,border-color .15s} }
</style>

<script>
(function(){
const _BI=document.body.innerHTML, SRC=_BI.slice(Math.max(0,_BI.indexOf('<!--pk'+'-begin-->')));
let EMB=null; try{EMB=JSON.parse(document.getElementById('pk-data').textContent)}catch(e){}
const LETRAS='ABCDEFGHIJKL', PROG='__prog';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let state={nombre:'Torneo',fecha:'',sede:'',categorias:[],programa:null};
let ui={cat:ls.get('pk_cat')||null,tab:ls.get('pk_tab')||'config'};
if(ui.tab==='llaves') ui.tab='fase';
let editable=true, confirmAct=null, loaded=false, SCHED=null;

const F15=()=>({sets:1,puntos:15,gana2:true}), F21=()=>({sets:1,puntos:21,gana2:true});
const defProg=()=>({canchas:4,inicio:'11:00',dur:15,descanso:2,durFinal:15,horas:4});
function normS(S){S.programa=Object.assign(defProg(),S.programa||{});(S.categorias||[]).forEach(c=>{c.fmtG=c.fmtG||F15();c.fmtS=c.fmtS||F15();c.fmtF=c.fmtF||F21();c.fmtT=c.fmtT||Object.assign({},c.fmtF);c.res=c.res||{};});return S}
function migrate(){
  state.programa=Object.assign(defProg(),state.programa||{});
  delete state.finales;
  state.categorias.forEach(c=>{
    c.fmtG=c.fmtG||F15(); c.fmtS=c.fmtS||F15(); c.fmtF=c.fmtF||F21(); c.fmtT=c.fmtT||Object.assign({},c.fmtF);
    delete c.llave; delete c.fmtL; delete c.cruces; delete c.clasifican;
    c.res=c.res||{};
  });
}
function nuevaCategoria(nombre){
  return {id:uid(),nombre,modalidad:'dobles',grupos:2,fmtG:F15(),fmtS:F15(),fmtF:F21(),fmtT:F21(),equipos:[],res:{}};
}
const cat=()=>state.categorias.find(c=>c.id===ui.cat)||state.categorias[0];
const teamName=(c,id)=>{const t=c.equipos.find(e=>e.id===id); if(!t) return '—';
  const i=c.equipos.indexOf(t)+1;
  if(c.modalidad==='singles') return t.j1||('Jugador '+i);
  const a=t.j1,b=t.j2; return (a||b)?[a||'?',b||'?'].join(' / '):('Pareja '+i);};
const unidad=(c,pl)=>c.modalidad==='dobles'?(pl?'parejas':'pareja'):(pl?'jugadores':'jugador');

/* ---------- results ---------- */
function getRes(c,key,a,b){
  const r=c.res[key]; if(!r) return {g:[]};
  let g=r.g||[];
  if(r.a&&a&&r.a!==a){ if(r.a===b&&r.b===a) g=g.map(x=>[x[1],x[0]]); else g=[]; }
  return {g};
}
function evalMatch(g,fmt){
  const need=fmt.sets===3?2:1; let wa=0,wb=0,pa=0,pb=0,bad=[],played=0;
  for(let i=0;i<fmt.sets;i++){
    const x=g[i]; if(!x) continue; const A=x[0],B=x[1];
    if(A===''||B===''||A==null||B==null) continue;
    if(wa>=need||wb>=need) break;
    played++; pa+=A; pb+=B;
    const hi=Math.max(A,B),lo=Math.min(A,B);
    const okG = A!==B && hi>=fmt.puntos && (fmt.gana2 ? (hi-lo>=2 && (hi===fmt.puntos||hi-lo===2)) : hi===fmt.puntos);
    if(!okG) bad.push(i);
    if(A>B) wa++; else if(B>A) wb++;
  }
  const done=wa>=need||wb>=need;
  return {wa,wb,pa,pb,done,winner:done?(wa>wb?0:1):null,bad,started:played>0};
}

/* ---------- groups ---------- */
function teamsIn(c,g){return c.equipos.filter(e=>e.grupo===g)}
function groupMatches(c,g){
  const t=teamsIn(c,g).map(e=>e.id); if(t.length<2) return [];
  if(t.length%2) t.push(null);
  const n=t.length, out=[]; let arr=t.slice();
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i]; if(a&&b) out.push({key:'G_'+[a,b].sort().join('_'),a,b,ronda:r+1});}
    arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  return out;
}
function standings(c,g){
  const rows={}; teamsIn(c,g).forEach(e=>rows[e.id]={id:e.id,pj:0,pg:0,pp:0,gf:0,gc:0,pf:0,pc:0,grupo:g});
  let jugados=0; const ms=groupMatches(c,g);
  ms.forEach(m=>{const ev=evalMatch(getRes(c,m.key,m.a,m.b).g,c.fmtG); if(!ev.done) return; jugados++;
    const A=rows[m.a],B=rows[m.b]; A.pj++;B.pj++; A.gf+=ev.wa;A.gc+=ev.wb;B.gf+=ev.wb;B.gc+=ev.wa;
    A.pf+=ev.pa;A.pc+=ev.pb;B.pf+=ev.pb;B.pc+=ev.pa; if(ev.winner===0){A.pg++;B.pp++}else{B.pg++;A.pp++}});
  return {list:Object.values(rows).sort(cmpStats),jugados,total:ms.length};
}
function cmpStats(x,y){return y.pg-x.pg||(y.gf-y.gc)-(x.gf-x.gc)||(y.pf-y.pc)-(x.pf-x.pc)||y.pf-x.pf}
function serpentine(n,G){const out=[];for(let i=0;i<n;i++){const r=Math.floor(i/G),p=i%G;out.push(r%2?G-1-p:p)}return out}
function groupDone(c,g){const s=standings(c,g);return s.total>0&&s.jugados===s.total}
function pendGrupos(c){let p=0;for(let g=0;g<c.grupos;g++){const s=standings(c,g);p+=s.total-s.jugados}return p}

/* ---------- Copa de Oro / Plata ---------- */
const COPAS=[['oro','Copa de Oro'],['plata','Copa de Plata']];
function seedDefs(c){
  if(c.grupos>=2) return {oro:[[[0,1],[1,2]],[[1,1],[0,2]]], plata:[[[0,3],[1,4]],[[1,3],[0,4]]]};
  return {oro:[[[0,1],[0,4]],[[0,2],[0,3]]], plata:[[[0,5],[0,8]],[[0,6],[0,7]]]};
}
function seedLabel(c,[g,pos]){return c.grupos>=2?`${pos}º Grupo ${LETRAS[g]}`:`${pos}º del grupo`}
function resolveSeed(c,sd){
  const [g,pos]=sd, st=standings(c,g), row=st.list[pos-1];
  if(!row) return {id:null,missing:true,label:seedLabel(c,sd)};
  return {id:groupDone(c,g)?row.id:null,prov:st.jugados?row.id:null,label:seedLabel(c,sd)};
}
function faseModel(c){
  const d=seedDefs(c), out={};
  COPAS.forEach(([copa])=>{
    const semis=d[copa].map((pair,i)=>{
      const sa=resolveSeed(c,pair[0]), sb=resolveSeed(c,pair[1]);
      const m={key:(copa==='oro'?'SO':'SP')+(i+1),kind:'S',copa,i,sa,sb,a:sa.id,b:sb.id,missing:!!(sa.missing||sb.missing)};
      if(m.a&&m.b){const ev=evalMatch(getRes(c,m.key,m.a,m.b).g,c.fmtS);m.ev=ev;if(ev.done){m.win=ev.winner===0?m.a:m.b;m.lose=ev.winner===0?m.b:m.a}}
      return m;});
    const f={key:copa==='oro'?'FO':'FP',kind:'F',copa,a:semis[0].win||null,b:semis[1].win||null,missing:semis.some(s=>s.missing)};
    if(f.a&&f.b){const ev=evalMatch(getRes(c,f.key,f.a,f.b).g,c.fmtF);f.ev=ev;if(ev.done){f.win=ev.winner===0?f.a:f.b;f.lose=ev.winner===0?f.b:f.a}}
    const t3={key:copa==='oro'?'TO':'TP',kind:'T',copa,a:semis[0].lose||null,b:semis[1].lose||null,missing:f.missing};
    if(t3.a&&t3.b){const ev=evalMatch(getRes(c,t3.key,t3.a,t3.b).g,c.fmtT);t3.ev=ev;if(ev.done){t3.win=ev.winner===0?t3.a:t3.b;t3.lose=ev.winner===0?t3.b:t3.a}}
    out[copa]={semis,final:f,tercero:t3,missing:f.missing};
  });
  return out;
}

/* ---------- programa del día ---------- */
function hm2min(s){const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'').trim());return m?(+m[1])*60+(+m[2]):660}
function min2hm(x){x=Math.round(x);const h=Math.floor(x/60)%24,m=((x%60)+60)%60;return h+':'+String(m).padStart(2,'0')}
function allMatches(S){S=S||state;
  const L=[];
  S.categorias.forEach((c,ci)=>{
    const gs=[];
    for(let g=0;g<c.grupos;g++) groupMatches(c,g).forEach(m=>gs.push({cat:c,ci,kind:'G',key:m.key,uid:c.id+'|'+m.key,g,ronda:m.ronda,a:m.a,b:m.b,teams:[c.id+m.a,c.id+m.b]}));
    gs.forEach(x=>x.deps=gs.filter(y=>y.g===x.g&&y.ronda===x.ronda-1).map(y=>y.uid));
    L.push(...gs);
    const fm=faseModel(c), gu=gs.map(x=>x.uid);
    COPAS.forEach(([copa])=>{const F=fm[copa]; if(F.missing) return;
      F.semis.forEach(s=>L.push({cat:c,ci,kind:'S',copa,key:s.key,uid:c.id+'|'+s.key,m:s,deps:gu,teams:[c.id+s.key+'a',c.id+s.key+'b']}));
      L.push({cat:c,ci,kind:'T',copa,key:F.tercero.key,uid:c.id+'|'+F.tercero.key,m:F.tercero,deps:F.semis.map(s=>c.id+'|'+s.key),teams:[c.id+F.tercero.key+'a',c.id+F.tercero.key+'b']});
      L.push({cat:c,ci,kind:'F',copa,key:F.final.key,uid:c.id+'|'+F.final.key,m:F.final,deps:F.semis.map(s=>c.id+'|'+s.key),teams:[c.id+F.final.key+'a',c.id+F.final.key+'b']});
    });
  });
  return L;
}
function schedule(S){S=S||state;
  const P=S.programa, C=Math.max(1,Math.min(20,P.canchas|0)), items=allMatches(S), ord={G:0,S:1,T:2,F:3};
  items.sort((x,y)=>ord[x.kind]-ord[y.kind]||(x.ronda||0)-(y.ronda||0)||x.ci-y.ci||(x.g||0)-(y.g||0)||(x.copa==='oro'?0:1)-(y.copa==='oro'?0:1));
  const at={}, turns=[], last={}; let left=items.slice(), guard=0, seguidos=0;
  while(left.length&&guard++<600){
    const t=turns.length, pick=[], busy=new Set();
    for(const pass of [0,1]) for(const m of left){
      if(pick.length>=C) break;
      if(pick.includes(m)||!m.deps.every(u=>at[u]!==undefined&&at[u]<t)||m.teams.some(x=>busy.has(x))) continue;
      if(pass===0&&m.teams.some(x=>last[x]===t-1)) continue;
      pick.push(m); m.teams.forEach(x=>busy.add(x));
    }
    pick.forEach((m,i)=>{at[m.uid]=t;m.court=i+1;m.teams.forEach(x=>{if(m.kind==='G'&&last[x]===t-1)seguidos++;last[x]=t})});
    turns.push(pick); left=left.filter(m=>!pick.includes(m));
  }
  let cur=hm2min(P.inicio); const rows=[], map={};
  turns.forEach((pk,t)=>{const len=Math.max(P.dur,...pk.map(m=>m.kind==='F'||m.kind==='T'?P.durFinal:P.dur));rows.push({t,start:cur,end:cur+len,matches:pk});
    pk.forEach(m=>map[m.uid]={start:cur,court:m.court,turn:t+1});cur+=len+P.descanso;});
  const inicio=hm2min(P.inicio), fin=rows.length?rows[rows.length-1].end:inicio, limite=inicio+P.horas*60;
  const count={G:0,S:0,T:0,F:0}; items.forEach(m=>count[m.kind]++);
  return {rows,fin,inicio,limite,diff:limite-fin,map,total:items.length,C,count,seguidos};
}

let ref=null, saveTimer=null, lastSaved='', chain=Promise.resolve();
const st=document.getElementById('saveSt');
function status(t,cls){st.textContent=t;st.className='save'+(cls?' '+cls:'')}
function commit(){
  ls.set('pk_state',JSON.stringify(state));
  if(!ref){status('Guardado en este dispositivo');return}
  status('Guardando…','busy');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{saveTimer=null;chain=chain.then(async()=>{
    const s=JSON.stringify(state); if(s===lastSaved){status('Guardado');return}
    lastSaved=s;
    try{await ref.set({estado:JSON.parse(s),actualizado:new Date().toISOString()});status('Guardado');schedulePublish()}
    catch(e){ if(e&&e.code==='invalid_argument'){editable=false;status('Solo lectura');render()} else status('No se pudo guardar','err')}
  })},450);
}
const hhmm=iso=>{try{const d=new Date(iso);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}catch(e){return ''}};
const pubEl=document.getElementById('pubSt');
function pubStatus(t){pubEl.hidden=!t;pubEl.textContent=t||''}
let art=null, pubTimer=null, lastPub=JSON.stringify(EMB&&EMB.estado||null);
const DOC_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
function buildDoc(){
  const json=JSON.stringify({estado:state,publicado:new Date().toISOString()}).replace(/</g,'\\u003c');
  const re=/(<script type="application\/json" id="pk-data">)[\s\S]*?(<\/script>)/;
  if(!re.test(SRC)) return null;
  return DOC_HEAD+SRC.replace(re,(_,x,y)=>x+json+y)+'</body></html>';
}
function schedulePublish(ms){
  if(!art||!editable) return;
  if(JSON.stringify(state)===lastPub){pubStatus('Vista pública al día');return}
  clearTimeout(pubTimer); pubTimer=setTimeout(doPublish,ms||(window.__PKD||20000));
  pubStatus('Vista pública: se actualiza en unos segundos');
}
async function doPublish(){
  pubTimer=null;
  const f=document.activeElement;
  if(f&&f!==document.body&&/^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName)){pubTimer=setTimeout(doPublish,5000);return}
  if(saveTimer){pubTimer=setTimeout(doPublish,3000);return}
  const s=JSON.stringify(state); if(s===lastPub){pubStatus('Vista pública al día');return}
  const html=buildDoc(); if(!html){pubStatus('');return}
  pubStatus('Publicando vista pública…');
  try{ await chain; try{sessionStorage.setItem('pk_scroll',String(window.scrollY))}catch(e){} await art.publish(html); lastPub=s; pubStatus('Vista pública al día'); }
  catch(e){ const c=e&&e.code; if(c==='not_granted'||c==='not_writer'){art=null;pubStatus('')} else if(c==='conflict'){pubStatus('')} else {pubStatus('No se pudo actualizar la vista pública');pubTimer=setTimeout(doPublish,30000)} }
}
async function initStore(){
  const local=ls.get('pk_state'); let db=null;
  if(EMB&&EMB.estado){ state=EMB.estado; editable=false; loaded=true; if(!ls.get('pk_cat')) ui.cat=PROG; status('Vista pública · actualizada '+hhmm(EMB.publicado)); render(); }
  try{ db=window.claude&&window.claude.use?await window.claude.use('db'):null }catch(e){db=null}
  if(!db){
    DB=localDB();
    DB.collection('historial').onSnapshot(sn=>{histList=sn.docs.map(d=>Object.assign({id:d.id},d.data())).sort((x,y)=>String(y.finalizado).localeCompare(String(x.finalizado)));if(loaded&&(ui.cat===HIST||ui.cat===RES))render();});
    if(local){try{state=JSON.parse(local)}catch(e){}}
    else{ try{const rq=await fetch('datos/inicial.json',{cache:'no-store'}); if(rq.ok){const j=await rq.json(); if(j&&j.actual&&j.actual.categorias){state=j.actual; await guardarHistorialImport(j.historial); ls.set('pk_state',JSON.stringify(state));}}}catch(e){} }
    editable=true; loaded=true; status('Guardado en este dispositivo'); render(); return }
  DB=db; try{db.collection('historial').onSnapshot(sn=>{histList=sn.docs.map(d=>Object.assign({id:d.id},d.data())).sort((x,y)=>String(y.finalizado).localeCompare(String(x.finalizado)));if(ui.cat===HIST||ui.cat===RES)render();},()=>{})}catch(e){}
  let ce=null; try{const u=await window.claude.use('user'); if(u) ce=await u.canEdit();}catch(e){}
  editable=ce!==false;
  if(!editable&&!ls.get('pk_cat')) ui.cat=PROG;
  if(editable){ try{art=await window.claude.use('artifact')}catch(e){art=null} }
  ref=db.doc('torneo/actual'); let first=true;
  ref.onSnapshot(snap=>{
    if(!snap.exists){ if(first){first=false;loaded=true;status(editable?'Listo':'Solo lectura');render()} return }
    first=false;
    const s=JSON.stringify(snap.data().estado);
    if(saveTimer||s===lastSaved&&loaded) return;
    lastSaved=s; state=JSON.parse(s); loaded=true;
    status(editable?'Guardado':'Solo lectura · en vivo'); render(); schedulePublish();
  },()=>status('Sin conexión','err'));
}

  let jug=0,tot=0; for(let g=0;g<c.grupos;g++){const s=standings(c,g);jug+=s.jugados;tot+=s.total}

function vGrupos(c){

  const tagFor=i=>c.grupos>=2?(i<2?'oro':i<4?'plata':''):(i<4?'oro':i<8?'plata':'');
  for(let g=0;g<c.grupos;g++){

function seedLine(c,sd){return `<span class="seed">${esc(sd.label)}</span>${sd.prov&&!sd.id?`<small>Hoy: ${esc(teamName(c,sd.prov))}</small>`:''}`}
function vFase(c){
  const fm=faseModel(c), pend=pendGrupos(c);
  let out=`<p class="hint">Semifinales: ${fmtTxt(c.fmtS)}. Finales: ${fmtTxt(c.fmtF)}. 3er y 4to lugar: ${fmtTxt(c.fmtT)}. ${pend?`Quedan ${pend} partido${pend>1?'s':''} de grupos: los cruces se completan solos cuando termine cada grupo. Mientras tanto ves quién va ocupando cada puesto.`:'La fase de grupos terminó: los cruces ya están definidos.'}</p>`;

    const champ=f.win?`<div class="champ"><span class="tr">★</span><div><span class="eyebrow">Campeón ${titulo} · ${esc(c.nombre)}</span><div class="who">${esc(teamName(c,f.win))}</div><div class="sub">Finalista: ${esc(teamName(c,f.lose))}</div></div></div>`:'';

function vPrograma(){
  const S=SCHED, P=state.programa, d=S.diff;
  const st=d>=0?`<div class="status ok"><span class="big">${min2hm(S.fin)}</span><div class="txt"><b>Termina a las ${min2hm(S.fin)}: cabe en el horario.</b><span>Te sobran ${d} minutos antes de las ${min2hm(S.limite)}.</span></div></div>`
    :`<div class="status warn"><span class="big">${min2hm(S.fin)}</span><div class="txt"><b>Termina a las ${min2hm(S.fin)}: se pasa ${-d} minutos de las ${min2hm(S.limite)}.</b><span>Prueba con otra cancha, partidos más cortos o menos parejas por grupo.</span></div></div>`;
  const inp=(k,l,type,extra='')=>`<div class="field"><label for="p_${k}">${l}</label><input id="p_${k}" class="inp" type="${type}" ${extra} data-pf="${k}" value="${esc(P[k])}"${dis()}></div>`;
  const cfg=`<div class="box"><h2>Horario y canchas</h2><div class="grid3">
    ${inp('canchas','Canchas','number','min="1" max="20" inputmode="numeric"')}

    ${inp('dur','Minutos por partido','number','min="5" max="90" inputmode="numeric"')}
    ${inp('descanso','Descanso entre partidos','number','min="0" max="30" inputmode="numeric"')}
    ${inp('durFinal','Minutos por final','number','min="5" max="90" inputmode="numeric"')}
  </div><p class="hint">Cada turno dura ${P.dur} minutos de juego más ${P.descanso} de descanso. Los partidos de un grupo respetan el orden de las fechas, y las semifinales parten cuando ese nivel termina sus grupos.</p></div>`;
  const stats=`<div class="stats"><div class="stat"><b>${S.count.G}</b><span>Fase de grupos</span></div><div class="stat"><b>${S.count.S}</b><span>Semifinales</span></div><div class="stat"><b>${S.count.T}</b><span>Por el 3er lugar</span></div><div class="stat"><b>${S.count.F}</b><span>Finales</span></div><div class="stat"><b>${S.rows.length}</b><span>Turnos</span></div><div class="stat"><b>${S.C}</b><span>Canchas</span></div></div>`;
  const cell=m=>{
    const c=m.cat, cop=m.copa==='plata'?'Plata':'Oro';
    let ph,vs,res='';
    if(m.kind==='G'){ph=`Grupo ${LETRAS[m.g]} · Fecha ${m.ronda}`;vs=`${esc(teamName(c,m.a))} <span class="seed">vs</span> ${esc(teamName(c,m.b))}`;
      const ev=evalMatch(getRes(c,m.key,m.a,m.b).g,c.fmtG); if(ev.done) res=`${ev.pa}–${ev.pb}`;}
    else{const x=m.m; ph=(m.kind==='S'?'Semifinal ':m.kind==='T'?'3er lugar ':'Final ')+cop+(m.kind==='S'?' '+(x.i+1):'');
      const nm=(id,alt)=>id?esc(teamName(c,id)):`<span class="seed">${alt}</span>`;
      vs=m.kind==='S'?`${nm(x.a,x.sa.label)} <span class="seed">vs</span> ${nm(x.b,x.sb.label)}`:m.kind==='T'?`${nm(x.a,'Perdedor SF 1')} <span class="seed">vs</span> ${nm(x.b,'Perdedor SF 2')}`:`${nm(x.a,'Ganador SF 1')} <span class="seed">vs</span> ${nm(x.b,'Ganador SF 2')}`;
      if(x.ev&&x.ev.done) res=`${x.ev.pa}–${x.ev.pb}`;}
    return `<div class="cell k-${m.kind} ${m.copa||''}"><span class="ph"><b>${esc(c.nombre)}</b> · ${ph}</span><span class="vs">${vs}</span>${res?`<span class="res">Resultado ${res}</span>`:''}</div>`;
  };
  const head=`<tr><th>Hora</th>${Array.from({length:S.C},(_,i)=>`<th>Cancha ${i+1}</th>`).join('')}</tr>`;
  const body=S.rows.map(r=>`<tr${r.start>=S.limite?' style="opacity:.6"':''}><td class="hr"><b>${min2hm(r.start)}</b><span>Turno ${r.t+1}</span></td>${Array.from({length:S.C},(_,i)=>{const m=r.matches.find(x=>x.court===i+1);return `<td>${m?cell(m):''}</td>`}).join('')}</tr>`).join('');
  return `${st}${stats}${cfg}<section class="box"><div class="gh"><h2>Programa por cancha</h2><span class="prog">${S.total} partidos</span></div>
    <div class="scroll"><table class="ptab"><thead>${head}</thead><tbody>${body}</tbody></table></div></section>`;
}

function setPath(o,path,v){const p=path.split('.');let x=o;while(p.length>1)x=x[p.shift()];x[p[0]]=v}
function resize(c,n){n=Math.max(0,Math.min(128,n|0));
  while(c.equipos.length<n){const i=c.equipos.length;c.equipos.push({id:uid(),j1:'',j2:'',grupo:serpentine(i+1,c.grupos)[i]})}
  c.equipos.length=n;}
function regroup(c,order){const g=serpentine(order.length,c.grupos);order.forEach((e,i)=>e.grupo=g[i])}
function setField(c,f,val,el){
  if(f==='cantidad'){resize(c,parseInt(val)||0);return}
  if(f==='grupos'){c.grupos=Math.max(1,Math.min(2,parseInt(val)||1));regroup(c,c.equipos);return}
  if(/\.gana2$/.test(f)){setPath(c,f,el.checked);return}
  if(/\.(sets|puntos)$/.test(f)){const n=parseInt(val);if(n>0)setPath(c,f,n);return}
  setPath(c,f,val);
}
app.addEventListener('click',e=>{

  if(a==='hsel'){ui.hist=b.dataset.id;confirmAct=null;render();window.scrollTo(0,0);return}

  if(!editable) return;

  if(a==='hdel'){const id=b.dataset.id;confirmAct=null;if(DB)DB.collection('historial').doc(id).delete().then(()=>{ui.hist=null;render()}).catch(()=>setToast('No se pudo borrar.'));return}
  const c=cat();

  else return;
  commit();render();
});

const fmtFecha=iso=>{try{const d=new Date(iso);return d.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}};
function validGames(c,key,a,b){return getRes(c,key,a,b).g.filter(x=>x&&x[0]!==''&&x[1]!==''&&x[0]!=null&&x[1]!=null)}
function koList(c){const fm=faseModel(c),L=[];COPAS.forEach(([k,t])=>{const F=fm[k];if(F.missing)return;F.semis.forEach((s,i)=>L.push({m:s,fmt:c.fmtS,fase:'Semifinal '+(i+1),copa:t,k}));L.push({m:F.tercero,fmt:c.fmtT,fase:'3er y 4to lugar',copa:t,k});L.push({m:F.final,fmt:c.fmtF,fase:'Final',copa:t,k});});return L}
function estadoTorneo(S){
  let pend=0,tot=0;
  S.categorias.forEach(c=>{for(let g=0;g<c.grupos;g++){const st=standings(c,g);pend+=st.total-st.jugados;tot+=st.total}
    koList(c).forEach(x=>{tot++;if(!(x.m.ev&&x.m.ev.done))pend++})});
  return {pend,tot,terminado:tot>0&&pend===0};
}
function exportBar(src){
  return `<div class="exbar">
    <button class="btn small" data-act="exp" data-kind="podio" data-src="${src}">Imagen: podio y finales</button>
    <button class="btn small" data-act="exp" data-kind="semis" data-src="${src}">Imagen: semifinales</button>
    <button class="btn small" data-act="exp" data-kind="grupos" data-src="${src}">Imagen: tablas de grupos</button>
    <button class="btn small" data-act="exp" data-kind="partidos" data-src="${src}">Imagen: resultados de grupos</button>
    <button class="btn ghost small" data-act="exp" data-kind="xlsx" data-src="${src}">Excel con todos los partidos</button>
  </div><div class="exmsg" role="status">${esc(toastTxt)}</div>`;
}
function podioHTML(S){
  return `<div class="lvsum">${S.categorias.map(c=>{const fm=faseModel(c);
    return COPAS.map(([k,t])=>{const F=fm[k]; if(F.missing) return '';
      const f=F.final,t3=F.tercero,pos=(n,id)=>`<div class="p${n}"><span>${n}º lugar</span><b>${id?esc(teamName(c,id)):'<span class="seed">Por definir</span>'}</b></div>`;
      return `<section class="box copa ${k}"><h3>${esc(c.nombre)} · ${t}</h3><div class="podio">${pos(1,f.win)}${pos(2,f.lose)}${pos(3,t3.win)}${pos(4,t3.lose)}</div></section>`;}).join('');}).join('')}</div>`;
}
function vResumen(){
  const E=estadoTorneo(state);
  const st=E.terminado?`<span class="okst">El torneo terminó: todos los partidos tienen resultado.</span>`:`<span class="pendst">Faltan ${E.pend} de ${E.tot} partidos por anotar. Puedes exportar igual; lo pendiente sale como “Por definir”.</span>`;
  let cierre='';
  if(editable){
    cierre = confirmAct==='nuevo'
      ? `<div class="box"><h2>Guardar y comenzar un torneo nuevo</h2>
          <p class="hint">“${esc(state.nombre)}” se guarda completo en el Historial, con todos sus resultados. Después la app queda lista para el torneo nuevo, con los mismos niveles, formatos y horario.</p>
          <div class="field"><label for="nvNombre">Nombre del nuevo torneo</label><input id="nvNombre" class="inp" value="${esc('2do Torneo')}"></div>
          <label class="radio"><input type="radio" name="nvKeep" value="no" checked> Empezar sin parejas inscritas</label>
          <label class="radio"><input type="radio" name="nvKeep" value="si"> Mantener las mismas parejas y grupos</label>
          ${E.terminado?'':`<p class="pendst">Ojo: este torneo todavía tiene ${E.pend} partidos sin resultado y se guardará así.</p>`}
          <div class="row"><button class="btn" data-act="nuevoGo">Guardar en historial y crear torneo nuevo</button><button class="btn ghost" data-act="noconf">Cancelar</button></div></div>`
      : `<div class="box"><h2>Cerrar este torneo</h2><p class="hint">Guarda este torneo en el Historial y deja la app lista para el siguiente.</p><div class="row"><button class="btn ghost" data-act="ask" data-id="nuevo"${DB?'':' disabled'}>Guardar en historial y crear torneo nuevo</button></div>${DB?'':'<p class="hint">Para guardar el historial la app tiene que estar conectada.</p>'}</div>`;
  }
  return `<div class="box"><h2>Resumen · ${esc(state.nombre)}</h2>${st}${exportBar('cur')}</div>${podioHTML(state)}${cierre}${window.claude?'':respaldoBox()}`;
}
function vHistorial(){
  if(!DB) return `<div class="empty"><h3>Historial</h3><p class="hint">El historial se guarda en línea: ábrelo con tu cuenta para verlo.</p></div>`;
  if(ui.hist){
    const h=histList.find(x=>x.id===ui.hist);
    if(!h){ui.hist=null;return vHistorial()}
    const S=normS(JSON.parse(JSON.stringify(h.estado)));
    const del=!editable?'':confirmAct==='hdel'?`<button class="btn danger small" data-act="hdel" data-id="${h.id}">Sí, borrar del historial</button><button class="btn ghost small" data-act="noconf">Cancelar</button>`:`<button class="btn danger small" data-act="ask" data-id="hdel">Borrar del historial</button>`;
    return `<div class="row"><button class="btn ghost small" data-act="hback">← Volver al historial</button></div>
      <div class="box"><h2>${esc(S.nombre)}</h2><span class="hint">${esc(S.fecha||'')}${S.sede?' · '+esc(S.sede):''} · guardado el ${fmtFecha(h.finalizado)}</span>${exportBar(h.id)}</div>
      ${podioHTML(S)}<div class="row">${del}</div>`;
  }
  if(!histList.length) return (window.claude?'':respaldoBox())+`<div class="empty"><h3>Historial vacío</h3><p class="hint">Cuando cierres un torneo desde “Resumen y exportar”, queda guardado aquí con todos sus resultados.</p></div>`;
  return (window.claude?'':respaldoBox())+`<div class="box"><h2>Historial de torneos</h2><p class="hint">${histList.length} torneo${histList.length>1?'s':''} guardado${histList.length>1?'s':''}. Abre uno para ver su podio o descargar sus imágenes y su Excel.</p></div>
    <div class="hlist">${histList.map(h=>{const S=normS(JSON.parse(JSON.stringify(h.estado||{categorias:[]})));
      const camp=S.categorias.map(c=>{const fm=faseModel(c);return COPAS.map(([k,t])=>fm[k].final.win?`<li>${esc(c.nombre)} · ${t}: <b>${esc(teamName(c,fm[k].final.win))}</b></li>`:'').join('')}).join('');
      return `<div class="hcard"><h3>${esc(S.nombre)}</h3><span class="meta">${esc(S.fecha||'')}${S.sede?' · '+esc(S.sede):''} · ${S.categorias.reduce((n,c)=>n+c.equipos.length,0)} parejas</span>${camp?`<ul>${camp}</ul>`:''}<div class="row"><button class="btn small" data-act="hsel" data-id="${h.id}">Ver y exportar</button></div></div>`}).join('')}</div>`;
}
async function nuevoTorneo(keep,nombre){
  if(!DB){setToast('Necesitas estar conectada para guardar el historial.');return}
  setToast('Guardando en el historial…');
  try{
    const snap=JSON.parse(JSON.stringify(state));
    await DB.collection('historial').doc('t'+Date.now()).set({estado:snap,nombre:snap.nombre||'',fecha:snap.fecha||'',finalizado:new Date().toISOString()});
  }catch(e){setToast('No se pudo guardar en el historial. El torneo actual no se modificó.');return}
  state={nombre,fecha:'',sede:state.sede||'',programa:Object.assign({},state.programa),
    categorias:state.categorias.map(c=>Object.assign({},c,{equipos:keep?c.equipos.map(e=>Object.assign({},e)):[],res:{}}))};
  confirmAct=null; ui.cat=state.categorias[0]?state.categorias[0].id:null; ui.tab=keep?'grupos':'equipos';
  setToast(''); commit(); render(); window.scrollTo(0,0);
}

async function renderImg(S,kind){
  const host=document.createElement('div'); host.style.cssText='position:absolute;left:-12000px;top:0;width:1080px';

  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready;

/* excel */
function buildXlsx(S){
  const X=window.XLSX, sch=schedule(S), wb=X.utils.book_new();
  const head=['Nivel','Fase','Grupo / Copa','Partido','Hora','Cancha','Pareja 1','Pareja 2','Juego 1','Juego 2','Juego 3','Juegos P1','Juegos P2','Puntos P1','Puntos P2','Ganador','Estado'];
  const rows=[head];
  const add=(c,fase,grupo,label,m,fmt)=>{
    const w=sch.map[c.id+'|'+m.key]; const gs=m.a&&m.b?getRes(c,m.key,m.a,m.b).g:[]; const ev=m.a&&m.b?evalMatch(gs,fmt):null;
    const j=i=>{const x=gs[i];return x&&x[0]!==''&&x[1]!==''&&x[0]!=null&&x[1]!=null?`${x[0]}-${x[1]}`:''};
    rows.push([c.nombre,fase,grupo,label,w?min2hm(w.start):'',w?w.court:'',m.a?teamName(c,m.a):(m.sa?m.sa.label:'Por definir'),m.b?teamName(c,m.b):(m.sb?m.sb.label:'Por definir'),j(0),j(1),j(2),ev?ev.wa:'',ev?ev.wb:'',ev?ev.pa:'',ev?ev.pb:'',ev&&ev.done?teamName(c,ev.winner===0?m.a:m.b):'',ev&&ev.done?'Jugado':'Pendiente']);
  };
  S.categorias.forEach(c=>{
    for(let g=0;g<c.grupos;g++) groupMatches(c,g).forEach(m=>add(c,'Fase de grupos','Grupo '+LETRAS[g],'Fecha '+m.ronda,m,c.fmtG));
    koList(c).forEach(x=>add(c,x.fase.startsWith('Semi')?'Semifinal':x.fase==='Final'?'Final':'3er y 4to lugar',x.copa,x.fase,x.m,x.fmt));
  });
  const ws1=X.utils.aoa_to_sheet(rows); ws1['!cols']=head.map((h,i)=>({wch:[14,16,14,16,7,7,26,26,9,9,9,9,9,9,9,26,10][i]})); ws1['!autofilter']={ref:'A1:Q'+rows.length};
  X.utils.book_append_sheet(wb,ws1,'Partidos');
  const pr=[['Nivel','Grupo','Posición','Pareja','PJ','PG','PP','Dif. juegos','Puntos a favor','Puntos en contra','Dif. puntos','Pasa a']];
  S.categorias.forEach(c=>{for(let g=0;g<c.grupos;g++) standings(c,g).list.forEach((r,i)=>{const t=c.grupos>=2?(i<2?'Copa de Oro':i<4?'Copa de Plata':''):(i<4?'Copa de Oro':i<8?'Copa de Plata':'');pr.push([c.nombre,'Grupo '+LETRAS[g],i+1,teamName(c,r.id),r.pj,r.pg,r.pp,r.gf-r.gc,r.pf,r.pc,r.pf-r.pc,t])})});
  const ws2=X.utils.aoa_to_sheet(pr); ws2['!cols']=[14,9,9,26,5,5,5,11,14,16,11,14].map(w=>({wch:w})); X.utils.book_append_sheet(wb,ws2,'Posiciones');
  const po=[['Nivel','Copa','Lugar','Pareja']];
  S.categorias.forEach(c=>{const fm=faseModel(c);COPAS.forEach(([k,t])=>{const F=fm[k];if(F.missing)return;[[1,F.final.win],[2,F.final.lose],[3,F.tercero.win],[4,F.tercero.lose]].forEach(([n,id])=>po.push([c.nombre,t,n+'º',id?teamName(c,id):'Por definir']))})});
  const ws3=X.utils.aoa_to_sheet(po); ws3['!cols']=[14,14,7,28].map(w=>({wch:w})); X.utils.book_append_sheet(wb,ws3,'Podio');
  const info=[['Torneo',S.nombre||''],['Fecha',S.fecha||''],['Sede',S.sede||''],['Inicio',S.programa.inicio],['Canchas',S.programa.canchas]];
  S.categorias.forEach(c=>info.push([c.nombre,`Grupos: ${fmtTxt(c.fmtG)} · Semis: ${fmtTxt(c.fmtS)} · Final: ${fmtTxt(c.fmtF)} · 3er lugar: ${fmtTxt(c.fmtT)}`]));
  const ws4=X.utils.aoa_to_sheet(info); ws4['!cols']=[{wch:16},{wch:110}]; X.utils.book_append_sheet(wb,ws4,'Torneo');
  return X.write(wb,{type:'array',bookType:'xlsx'});
}
async function exportar(kind,src){
  let S;
  if(src==='cur') S=state; else {const h=histList.find(x=>x.id===src); if(!h) return; S=normS(JSON.parse(JSON.stringify(h.estado)));}
  const dl=await getDL();
  if(!dl){setToast('Las descargas no están disponibles en esta vista. Abre la app en claude.ai para descargar.');return}
  const base=slug(S.nombre);
  try{
    if(kind==='xlsx'){setToast('Preparando el Excel…'); if(!window.XLSX) await loadScript(LIB_XLSX); const buf=buildXlsx(S); await dl.save({filename:base+'-resultados.xlsx',data:buf});}
    else {setToast('Preparando la imagen…'); if(!window.html2canvas) await loadScript(LIB_H2C); const blob=await renderImg(S,kind); await dl.save({filename:`${base}-${kind}.png`,data:blob});}
    setToast('Listo, archivo descargado.');
  }catch(e){const c=e&&e.code;
    setToast(c==='declined'?'Descarga cancelada.':c==='rate_limited'?'Hay otra descarga esperando confirmación: acéptala o ciérrala y vuelve a intentar.':'No se pudo generar el archivo'+(e&&e.message&&!c?' ('+e.message+')':'')+'.');}
}

render(); initStore();
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
})();
